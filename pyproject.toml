[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-reborn"
version = "1.0.0"
description = "VA strategy terminal for Binance Spot: REAL/PAPER, permission-aware trading and Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "waitress>=3.0,<4",
    "websocket-client>=1.8,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
rice-reborn = "rice_reborn.main:main"

[tool.setuptools.packages.find]
include = ["rice_reborn*"]

[tool.setuptools.package-data]
rice_reborn = ["templates/*.html", "templates/*.xlsx", "static/*.css", "static/*.js", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
